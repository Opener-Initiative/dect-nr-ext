site_name: DECT NR+ NS3 simulation project
nav:
  - Main Page: index.md
  - DECT NR+ NS3 Technical Reference: technical_reference.md
  - Installation: installation.md
  - Simulation: simulation.md
theme:
  name: material
  icon:
    logo: material/library-shelves
  palette: 
    primary: black
    accent: cyan
  features:
    - content.code.copy
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences
plugins:
  - offline